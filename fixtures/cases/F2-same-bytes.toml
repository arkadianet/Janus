id = "F2"
title = "Same BLAKE3 is one blob, two files"
see = "docs/family-key-cases.md"
# same_blob is a symbolic token: every file with the same token shares one
# fixture byte payload (one BLAKE3 + size). "x" is not a digest. The
# harness resolves the token to that payload before hashing.

[[files]]
name = "a/qwen.gguf"
same_blob = "x"

[[files]]
name = "b/qwen-copy.gguf"
same_blob = "x"

[expect]
family_count = 1
blob_count = 1
file_count = 2
reclaimable_inodes = 1
